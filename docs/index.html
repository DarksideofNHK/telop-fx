<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>テロップカタログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@800;900&family=BIZ+UDPGothic:wght@400;700&family=Source+Code+Pro:wght@500&display=swap">
<style>
/* 型録の台紙：上に絞り込みの帯（系統・NHK・検索）、下に系統ごとの段。カードは見本の動画＋名前＋NHK の区分＋写す一行 */
:root {
  --bg: #f2f4f7;
  --panel: #ffffff;
  --line: #d9dde5;
  --fg: #16181d;
  --muted: #5d6370;
  --accent: #d0101c;
  --code-bg: #eef0f4;
  --use: #17723a; --use-bg: #dff3e5;
  --ok: #0f5f99; --ok-bg: #dcecf8;
  --no: #a2341a; --no-bg: #fbe3dc;
  --tbd: #6a4aa6; --tbd-bg: #ece5f8;
  --shadow: 0 1px 2px rgba(20, 24, 34, .06);
  --f-display: "M PLUS 1p", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  --f-mono: "Source Code Pro", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1c1f26; --line: #2e333d; --fg: #eceef2; --muted: #a0a6b2; --accent: #ff4b52; --code-bg: #252932;
    --use: #7ddc98; --use-bg: #1d3526; --ok: #7cc4ff; --ok-bg: #18303f; --no: #ff9f84; --no-bg: #3c231c; --tbd: #c8b0ff; --tbd-bg: #2c2440;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --panel: #1c1f26; --line: #2e333d; --fg: #eceef2; --muted: #a0a6b2; --accent: #ff4b52; --code-bg: #252932;
  --use: #7ddc98; --use-bg: #1d3526; --ok: #7cc4ff; --ok-bg: #18303f; --no: #ff9f84; --no-bg: #3c231c; --tbd: #c8b0ff; --tbd-bg: #2c2440;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.7 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1240px; margin: 0 auto; }
header.top { padding-block: 26px 14px; }
h1 { font: 900 clamp(28px, 4.4vw, 42px)/1.2 var(--f-display); margin: 0 0 8px; text-wrap: balance; }
h1 .n { color: var(--accent); }
.lead { margin: 0; max-width: 66ch; color: var(--muted); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-block: 1px solid var(--line); padding-block: 10px; }
.bar .inner { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 2px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.chip:focus-visible, select:focus-visible, input:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type=search] { font: inherit; font-size: 13.5px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
input[type=search] { width: 13em; max-width: 100%; }
.count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
main { padding-block: 22px 56px; }
main .inner { display: grid; gap: 34px; }
section.grp { display: grid; gap: 14px; }
.grp-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: 5px; }
.grp-head h2 { font: 900 21px/1.3 var(--f-display); margin: 0; }
.grp-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }
.card video { display: block; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; background: #10131c; object-fit: cover; }
.body { padding: 10px 12px 12px; display: grid; gap: 6px; flex: 1; align-content: start; }
.row1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.name { font: 500 14px/1.3 var(--f-mono); word-break: break-all; }
.nhk { font-size: 11.5px; border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.nhk.use { color: var(--use); background: var(--use-bg); }
.nhk.ok { color: var(--ok); background: var(--ok-bg); }
.nhk.no { color: var(--no); background: var(--no-bg); }
.nhk.tbd { color: var(--tbd); background: var(--tbd-bg); }
.desc { font-size: 13.5px; }
.meta { font-size: 12px; color: var(--muted); }
.snip { display: flex; gap: 7px; align-items: stretch; margin-top: 2px; }
.snip code { flex: 1; min-width: 0; font: 500 11.5px/1.5 var(--f-mono); background: var(--code-bg); border-radius: 6px; padding: 5px 7px; overflow-x: auto; white-space: nowrap; }
.copy { font: 700 12px var(--f-body); border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 0 9px; cursor: pointer; white-space: nowrap; }
.copy:hover { background: var(--accent); color: var(--panel); }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: 12.5px; }
@media (max-width: 640px) { .count { margin-left: 0; width: 100%; } }
@media (prefers-reduced-motion: reduce) { .card video { animation: none; } }
</style>
</head>
<body>

<header class="top pad">
  <div class="inner">
    <h1>テロップカタログ <span class="n" id="total"></span></h1>
    <p class="lead">決めテロップ（文字ごと焼き込んだ動画）の型録。系統ごとに見本の動画・NHK 系で使えるか・spec の <code>fx</code> に写す一行を並べた。Claude Code に名前で頼むか、「写す」の一行を telops.json の <code>fx</code> に入れる（使い方は <a href="https://github.com/DarksideofNHK/telop-fx">リポジトリ</a>）。NHK の区分は、作者が NHK 系の動画で使うかどうかの使い分け。</p>
  </div>
</header>

<div class="bar pad">
  <div class="inner">
    <div class="chips" id="chips" role="group" aria-label="系統で絞る"></div>
    <select id="nhkSel" aria-label="NHK 系で絞る">
      <option value="">NHK：全部</option>
      <option value="use">NHK の候補だけ</option>
      <option value="nhk">NHK で使えるもの（候補＋可）</option>
      <option value="tbd">NHK は未決のもの</option>
      <option value="no">NHK では使わないもの</option>
    </select>
    <input id="q" type="search" placeholder="名前・説明で探す" aria-label="名前・説明で探す">
    <span class="count" id="count"></span>
  </div>
</div>

<main class="pad">
  <div class="inner" id="list"></div>
</main>

<footer class="pad"><div class="inner" id="foot"></div></footer>

let group = '';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const line = c => `"fx": ${JSON.stringify(c.fx)}`;
$('#total').textContent = `${D.cards.length}枚`;
$('#foot').textContent = `${D.updated} 更新。見本の文は一般的な言い回しで、実在の人の発言や本物のニュースではない。`;
function chips() {
  const all = [{id: '', label: 'すべて'}].concat(D.groups);
  $('#chips').innerHTML = all.map(g => `<button class="chip" type="button" data-g="${g.id}" aria-pressed="${g.id === group}">${esc(g.label)}</button>`).join('');
}
function match(c) {
  const n = $('#nhkSel').value, q = $('#q').value.trim();
  if (group && c.group !== group) return false;
  if (n === 'nhk' && !(c.nhk === 'use' || c.nhk === 'ok')) return false;
  if (n && n !== 'nhk' && c.nhk !== n) return false;
  if (q && !(c.id + c.desc + c.style_desc).includes(q)) return false;
  return true;
}
function render() {
  const shown = D.cards.filter(match);
  $('#count').textContent = `${shown.length} / ${D.cards.length} 枚`;
  const html = D.groups.map(g => {
    const cs = shown.filter(c => c.group === g.id);
    if (!cs.length) return '';
    return `<section class="grp" aria-label="${esc(g.label)}">
      <div class="grp-head"><h2>${esc(g.label)}</h2><span>${cs.length}枚</span></div>
      <div class="cards">${cs.map(c => `
        <article class="card">
          <video src="m/${esc(c.id)}.mp4" poster="m/${esc(c.id)}.png" muted loop playsinline autoplay preload="none" aria-label="${esc(c.id)} の見本"></video>
          <div class="body">
            <div class="row1"><span class="name">${esc(c.id)}</span><span class="nhk ${c.nhk}">${esc(D.nhk[c.nhk] || '')}</span></div>
            <div class="desc">${esc(c.desc)}</div>
            <div class="meta">型 ${esc(c.style)}（${esc(c.style_desc)}）・出方 ${esc(c.inn)}</div>
            <div class="snip"><code>${esc(line(c))}</code><button class="copy" type="button" data-id="${esc(c.id)}">写す</button></div>
          </div>
        </article>`).join('')}</div></section>`;
  }).join('');
  $('#list').innerHTML = html || '<p class="empty">当てはまるものがない。絞り込みを外してください。</p>';
  watch();
}
let io;
function watch() {          // 見えているカードの動画だけ再生する（90本を一度に回さない）
  if (io) io.disconnect();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting && !reduce) { v.play().catch(() => {}); } else { v.pause(); }
  }), {rootMargin: '200px'}) : null;
  document.querySelectorAll('.card video').forEach(v => { v.removeAttribute('autoplay'); if (io) io.observe(v); });
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  group = b.dataset.g; chips(); render();
});
$('#nhkSel').addEventListener('change', render);
$('#q').addEventListener('input', render);
document.addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const c = D.cards.find(x => x.id === b.dataset.id), t = line(c);

  catch (_) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '選んだ'; }

});
chips(); render();
</script>
